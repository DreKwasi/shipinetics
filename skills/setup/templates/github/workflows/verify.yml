name: verify

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Replace with the project's toolchain setup and install step.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # CI is the uncached backstop for the local caches bin/verify may use (lint, typecheck and
      # build caches). Cache dependencies if you like, but don't restore those caches here.
      - run: bin/verify --full

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  evidence:
    # Every PR shows the change working: a linked recording (screenshots only when a change can't be
    # recorded) or a terminal transcript. Recordings are never in git, so the section must link one.
    # Generate the section with `evidence pr-body`.
    # No evidence is needed when every changed file is in .shipinetics/, a test (.shipinetics/test-paths)
    # or a path in .shipinetics/no-evidence-paths (or the defaults below when that file is missing).
    # The same rule runs in the PR hook (bin/evidence). Keep the defaults the same as there.
    # For any other change, a person can skip evidence with the no-evidence label, or with a
    # "None: <reason>" line in the Evidence section (for people who can't add labels).
    # The job enforces this only when .shipinetics/config sets "evidence = required". With the
    # default, "evidence = optional", it passes.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require evidence for changes that need it
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          d=.shipinetics
          mode="$(sed -n 's/^[[:space:]]*evidence[[:space:]]*=[[:space:]]*//p' "$d/config" 2>/dev/null | tail -n 1 | sed 's/[[:space:]]*#.*//; s/[[:space:]]*$//')"
          if [ "$mode" != required ]; then
            echo "Evidence is optional in this project. Set 'evidence = required' in $d/config to make this job check it."
            exit 0
          fi
          defaults="$RUNNER_TEMP/no-evidence-defaults"
          printf '%s\n' 'docs/*' '*.md' '.github/*' .gitignore .gitattributes .editorconfig '.vscode/*' 'LICENSE*' >"$defaults"
          ev_dir="$(sed -n 's/^[[:space:]]*evidence_dir[[:space:]]*=[[:space:]]*//p' "$d/config" 2>/dev/null | tail -n 1 | sed 's/[[:space:]]*#.*//; s/[[:space:]]*$//')"
          ev_dir="${ev_dir:-docs/evidence}"
          in_list() { # in_list <list file> <path>: true if a glob in the list matches the path
            local g
            [ -f "$1" ] || return 1
            while IFS= read -r g || [ -n "$g" ]; do
              g="${g%%#*}"; g="$(printf '%s' "$g" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$g" ] && continue
              [[ "$2" == $g ]] && return 0
            done <"$1"
            return 1
          }
          exempt() {
            case "$1" in "$d"/*|"$ev_dir"/*) return 0 ;; esac
            in_list "$d/test-paths" "$1" && return 0
            if [ -f "$d/no-evidence-paths" ]; then in_list "$d/no-evidence-paths" "$1"; else in_list "$defaults" "$1"; fi
          }
          need="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | while IFS= read -r f; do exempt "$f" || printf '%s\n' "$f"; done)"
          if [ -z "$need" ]; then
            echo "No evidence needed: every changed file is docs, tests or a path in $d/no-evidence-paths."
            exit 0
          fi
          files="$(printf '%s\n' "$need" | head -n 10 | sed 's/^/  /')"
          more=$(( $(printf '%s\n' "$need" | wc -l) - 10 ))
          [ "$more" -gt 0 ] && files="$files
            and $more more"
          how="These changed files need evidence:
          $files
          Do one of these:
            - Add a '## Evidence' section that links a recording or a terminal transcript. bin/evidence pr-body generates it.
            - If the files can't change what a user sees or what the app does, add their globs to $d/no-evidence-paths.
            - A person can skip evidence for this PR: add the label (gh pr edit ${{ github.event.pull_request.number }} --add-label no-evidence),
              or write 'None: <reason>' in the Evidence section. If the label doesn't exist yet: gh label create no-evidence"
          section="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n '/^## Evidence/,$p' | sed '1!{/^## /,$d;}')"
          if [ -z "$section" ]; then
            echo "::error::This PR has no '## Evidence' section."
            printf '%s\n' "$how"
            exit 1
          fi
          reason="$(printf '%s\n' "$section" | sed -n 's/^[[:space:]]*None:[[:space:]]*\([^[:space:]].*\)/\1/p' | head -n 1)"
          if [ -n "$reason" ]; then
            echo "::notice::Evidence skipped by the PR author: $reason"
            exit 0
          fi
          if ! printf '%s\n' "$section" | grep -qiE '(Video|Screenshot): *https?://|user-attachments|terminal\.log'; then
            echo "::error::The Evidence section links no recording, screenshot or terminal transcript. Upload the recording (evidence upload) or drag it into the PR description."
            printf '%s\n' "$how"
            exit 1
          fi
