name: Bug report
description: A part of Shipinetics does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not use this form for a security problem. Follow SECURITY.md, because a public issue shows the problem to everyone.
        Before you paste logs, remove the secrets, private paths and names from them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. Give the command or the prompt. If you know the hook or the skill that is part of the problem, name it.
      placeholder: |
        1. In a project set up with /shipinetics:setup ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: The error messages, the hook output, or the output of `shipinetics-config`.
      render: text
  - type: input
    id: version
    attributes:
      label: Shipinetics version
      description: The version in `.claude-plugin/plugin.json`, or the output of `shipinetics-update`.
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Antigravity
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system and bash version
      placeholder: macOS 15, /bin/bash 3.2.57
