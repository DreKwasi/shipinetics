name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # macOS for bash 3.2 and BSD tools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A pull request doesn't set the version
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: bash scripts/check-pr-version.sh "origin/${{ github.base_ref }}"
      - name: Syntax check every script
        run: for f in scripts/*.sh bin/* skills/setup/templates/bin/* skills/setup/templates/pre-* skills/setup/templates/commit-msg tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Tests (default bash)
        run: bash tests/run.sh
      - name: Tests (macOS system bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/run.sh
