name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches manifests and CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          c_ver="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          a_ver="$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          if [ "$ver" != "$c_ver" ] || [ "$ver" != "$a_ver" ]; then
            echo "Tag $TAG does not match manifests (.claude-plugin/plugin.json=$c_ver, plugin.json=$a_ver)" >&2
            exit 1
          fi
          bash scripts/release.sh --check

      - name: Run tests
        run: bash tests/run.sh

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "${TAG#v}" > /tmp/release-notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(ver)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit(f"No release notes found for {ver} in CHANGELOG.md")
          print(m.group(1).strip())
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "Shipinetics $TAG" --notes-file /tmp/release-notes.md
