name: pr-checks

# Checks on the pull request itself, not on the code. They run again when a label changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  changelog:
    name: CHANGELOG entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !startsWith(github.head_ref, 'release/') && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A change that users can see has an entry under Unreleased
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          base="$(git merge-base "$BASE" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          # Paths that change what users get. Docs, tests and CI alone need no entry.
          user_facing="$(printf '%s\n' "$changed" | grep -E '^(scripts/|bin/|skills/|agents/|hooks/|hooks\.json$|plugin\.json$|\.claude-plugin/|companions\.tsv$|harnesses\.tsv$)' || true)"
          if [ -z "$user_facing" ]; then
            echo "No user-facing files changed, so no CHANGELOG entry is needed."
            exit 0
          fi
          added="$(git diff "$base" HEAD -- CHANGELOG.md | grep -E '^\+[^+]' || true)"
          if [ -z "$added" ]; then
            echo "This pull request changes these files, but adds nothing to CHANGELOG.md:" >&2
            printf '  %s\n' $user_facing >&2
            echo "Add an entry under '## Unreleased' (see CONTRIBUTING.md). If users see no change, a maintainer can add the 'no-changelog' label." >&2
            exit 1
          fi
          echo "CHANGELOG.md has new lines."
